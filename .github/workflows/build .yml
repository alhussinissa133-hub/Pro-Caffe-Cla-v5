name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project root
        id: find
        run: |
          echo "Repo contents:"
          find . -maxdepth 3 -not -path './.git/*' | head -50
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts NOT FOUND"; exit 1; fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ProCaffe-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
